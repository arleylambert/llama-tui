# Perfil de exemplo do llama-tui
# Copie para ~/.config/llama-tui/profiles/ e ajuste o caminho do modelo:
#   cp examples/qwen3-8b.conf ~/.config/llama-tui/profiles/
#   llama-tui run qwen3-8b
#
# Formato: CHAVE=valor. Valor vazio = o parâmetro não é passado ao llama-server.
# Liga/desliga (MLOCK, NOMMAP, JINJA): 1 = ligado, vazio = desligado.
MODEL=/caminho/para/Qwen3-8B-Q4_K_M.gguf
PORT=8080
CTX=16384
NGL=99
THREADS=
BATCH=
UBATCH=
PARALLEL=
FLASH=on
CTK=q8_0
CTV=q8_0
MLOCK=
NOMMAP=
JINJA=1
ALIAS=qwen3-8b
APIKEY=troque-esta-chave
MMPROJ=
TEMP=0.7
EXTRA=--top-k 20 --top-p 0.8
