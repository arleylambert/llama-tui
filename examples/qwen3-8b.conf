# Example llama-tui profile
# Copy it to ~/.config/llama-tui/profiles/ and adjust the model path:
#   cp examples/qwen3-8b.conf ~/.config/llama-tui/profiles/
#   llama-tui run qwen3-8b
#
# Format: KEY=value. Empty value = the parameter is not passed to llama-server.
# On/off (MLOCK, NOMMAP, JINJA): 1 = on, empty = off.
MODEL=/path/to/Qwen3-8B-Q4_K_M.gguf
PORT=8080
CTX=16384
NGL=99
THREADS=
BATCH=
UBATCH=
PARALLEL=
FLASH=on
CTK=q8_0
CTV=q8_0
MLOCK=
NOMMAP=
JINJA=1
ALIAS=qwen3-8b
APIKEY=change-this-key
MMPROJ=
TEMP=0.7
EXTRA=--top-k 20 --top-p 0.8
